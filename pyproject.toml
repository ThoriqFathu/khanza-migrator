[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khanza-migrator"
version = "0.1.0"
description = "Khanza database migration testing and production execution tool"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
khanza-migrator = "app.cli:main"
